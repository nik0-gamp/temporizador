
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="contenedor">

        <h1>Temporizador Pomodoro</h1>

        <p id="tipoSesion">Tiempo de trabajo</p>

        <div class="temporizador" role="timer" aria-label="Tiempo restante">
            <span id="tiempo">25:00</span>
        </div>

        <div class="botones">
            <button id="iniciar">Iniciar</button>
            <button id="pausar">Pausar</button>
            <button id="reanudar">Reanudar</button>
        </div>

        <p class="sesiones">
            Sesiones completadas:
            <span id="sesionesCompletadas">0</span>
        </p>

        <section class="configuracion">

            <h2>Configuración</h2>

            <label for="tiempoTrabajo">Tiempo de trabajo (minutos)</label>
            <input type="number" id="tiempoTrabajo" min="1" value="25">

            <label for="tiempoCorto">Descanso corto (minutos)</label>
            <input type="number" id="tiempoCorto" min="1" value="5">

            <label for="tiempoLargo">Descanso largo (minutos)</label>
            <input type="number" id="tiempoLargo" min="1" value="15">

        </section>

        <p id="mensaje" role="status" aria-live="polite">
            Presiona iniciar para comenzar.
        </p>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
